<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our trips</title>
<meta name="theme-color" content="#16283A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trips">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --paper:#F3F5F4;--card:#FFFFFF;--ink:#16283A;--ink2:#3C4E60;--muted:#6E7C89;
  --line:#DDE3E7;--soft:#E8EDF0;--signal:#E3A21A;--air:#2B7A83;--red:#B0452E;--good:#3E9B6A;
  --r:14px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:calc(var(--safeT) + 14px) 18px 8px;max-width:640px;width:100%;margin:0 auto}
.top h1{font-size:1.4rem;font-weight:800;font-stretch:115%;letter-spacing:-.01em;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.ok{background:var(--good)}.dot.busy{background:var(--signal)}.dot.err{background:var(--red)}
.icon-btn{border:0;background:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.icon-btn svg{width:22px;height:22px}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;max-width:640px;margin:0 auto;padding:4px 16px 110px}
.view.on{display:block}
#v-map.on{display:flex;flex-direction:column;max-width:none;padding:0;height:100%}

/* bottom tabs */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safeB)}
.tabs button{flex:1;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(var(--safeB) + 76px);width:56px;height:56px;border-radius:18px;border:0;
  background:var(--signal);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(22,40,58,.25);z-index:500}
.fab svg{width:26px;height:26px}
.fab[hidden]{display:none}

/* next trip ticket */
.ticket{position:relative;background:var(--ink);color:#fff;border-radius:18px;padding:16px 20px 16px;margin:6px 0 24px;cursor:pointer}
.tk-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;color:rgba(255,255,255,.72)}
.tk-top span:first-child{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-top svg{width:16px;height:16px;flex:none}
.when{color:var(--signal);font-weight:700;white-space:nowrap}
.tk-route{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:14px;margin-top:14px}
.tk-route b{display:block;font-size:2.6rem;font-weight:800;font-stretch:125%;line-height:1}
.tk-route small{display:block;font-size:.78rem;color:rgba(255,255,255,.66);margin-top:4px;max-width:9.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-route .r{text-align:right}.tk-route .r small{margin-left:auto}
.tk-line{height:3px;margin-bottom:1.75rem;background:repeating-linear-gradient(90deg,var(--signal) 0 12px,transparent 12px 18px)}
.tk-line.flight{background:repeating-linear-gradient(90deg,#7FC3CA 0 4px,transparent 4px 9px)}
.tk-perf{position:relative;border-top:2px dashed rgba(255,255,255,.22);margin:16px 0 12px}
.tk-perf::before,.tk-perf::after{content:'';position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--paper)}
.tk-perf::before{left:-31px}.tk-perf::after{right:-31px}
.tk-meta{display:flex;flex-wrap:wrap;gap:10px 22px}
.tk-meta dt{font-size:.7rem;color:rgba(255,255,255,.55)}
.tk-meta dd{font-weight:600;margin:0}
.tk-note{font-size:.85rem;color:rgba(255,255,255,.75);margin-top:10px}

/* lists */
.sec{font-size:1.05rem;font-weight:800;font-stretch:112%;margin:4px 2px 4px}
.mon{font-size:.8rem;font-weight:700;color:var(--muted);margin:16px 2px 6px}
.list{list-style:none;padding:0;background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.row+.row{border-top:1px solid var(--line)}
.dt b{display:block;font-size:1.35rem;font-weight:800;font-stretch:112%;line-height:1}
.dt span{font-size:.72rem;color:var(--muted)}
.rt{min-width:0}
.codes{display:flex;align-items:center;gap:8px;font-weight:800;font-stretch:118%;font-size:1.02rem}
.trk{flex:0 0 26px;height:2px;background:var(--ink)}
.trk.flight{background:repeating-linear-gradient(90deg,var(--air) 0 4px,transparent 4px 7px)}
.sub{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{display:flex;flex-direction:column;align-items:flex-end;gap:4px;color:var(--muted)}
.md svg{width:18px;height:18px}
.tag{font-size:.68rem;background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--ink2);white-space:nowrap}
.tag.warn{background:#FBEBC7;color:#7A5300}
.row.cx .codes,.row.cx .sub{text-decoration:line-through;opacity:.5}
.more{grid-column:1/-1;display:none;font-size:.85rem;color:var(--ink2);padding-top:2px}
.row.open .more{display:block}
.more dl{display:flex;flex-wrap:wrap;gap:6px 20px}
.more dt{font-size:.7rem;color:var(--muted)}.more dd{margin:0;font-weight:600}
.more p{margin-top:6px}
.linkbtn{border:0;background:none;color:var(--ink2);font-weight:600;padding:16px 2px 4px}
.empty{color:var(--muted);text-align:center;padding:36px 10px}
.tiny{font-size:.7rem;color:var(--muted);text-align:center;padding-top:22px}
.hintbar{font-size:.82rem;color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:2px 0 14px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.calhead h2{font-size:1.15rem;font-weight:800;font-stretch:112%}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:.7rem;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1/1.08;border:0;background:var(--card);border-radius:10px;display:flex;flex-direction:column;align-items:center;padding:6px 0 0;gap:5px;font-size:.9rem;min-width:0}
.cd.out{background:transparent;color:#AEB9C2}
.cd.td{box-shadow:inset 0 0 0 2px var(--signal)}
.cd.sel{background:var(--ink);color:#fff}
.bars{display:flex;flex-direction:column;gap:2px;width:68%}
.bars i{height:4px;border-radius:2px;background:var(--ink)}
.bars i.flight{background:var(--air)}
.cd.sel .bars i{background:var(--signal)}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.dayhead h3{font-size:.95rem;font-weight:700}

/* map */
.mapbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 16px 8px;max-width:640px;width:100%;margin:0 auto}
.stats{font-size:.78rem;color:var(--muted);padding:0 16px 8px;max-width:640px;width:100%;margin:0 auto}
#mapbox{flex:1;min-height:0;background:#E9EEF0}
.leaflet-container{font-family:inherit}
.leaflet-popup-content{margin:10px 14px;font-size:.85rem;line-height:1.4}
.leaflet-popup-content b{font-size:.95rem}
select.pill{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:16px}

/* segmented */
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:.88rem;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,40,58,.14)}
.seg.full{display:flex;margin-bottom:12px}.seg.full button{flex:1;padding:9px 6px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(22,40,58,.38);display:none;z-index:1000}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;
  padding:10px 18px calc(var(--safeB) + 18px);z-index:1001;transform:translateY(105%);transition:transform .25s ease;max-width:640px;margin:0 auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 12px}
.sheet h2{font-size:1.25rem;font-weight:800;font-stretch:112%;margin-bottom:12px}
.sheet h3{font-size:.95rem;font-weight:700;margin:18px 0 6px}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.f input,.f select,.f textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FAFBFB;min-height:44px}
.f textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.acwrap{position:relative}
.ac{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(22,40,58,.16);
  list-style:none;padding:4px;margin-top:4px;z-index:5;max-height:260px;overflow-y:auto;display:none}
.ac.on{display:block}
.ac li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.ac li b{font-stretch:118%;min-width:3.3em}
.ac li span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac li small{color:var(--muted);margin-left:auto;font-size:.72rem;flex:none}
.ac li.hl,.ac li:hover{background:var(--soft)}
.ac li.find{color:var(--air);font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;background:var(--soft);min-height:44px}
.btn.primary{background:var(--ink);color:#fff;flex:1}
.btn.quiet{background:none;color:var(--ink2);padding-left:4px;padding-right:4px}
.btn.danger{background:none;color:var(--red);padding-left:4px;padding-right:4px}
.hint{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.state{font-size:.82rem;color:var(--ink2);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 86px);transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;
  font-size:.88rem;opacity:0;pointer-events:none;transition:.2s;z-index:1100;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
@media (min-width:700px){.sheet{bottom:auto;top:50%;border-radius:20px;transform:translateY(-40%);opacity:0;left:16px;right:16px}.sheet.on{transform:translateY(-50%);opacity:1}}
</style>
</head>
<body>

<header class="top">
  <h1>Our trips</h1>
  <span class="dot" id="dot" title="Sync status"></span>
  <button class="icon-btn" id="btnSettings" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="main">
  <section class="view" id="v-trips"></section>
  <section class="view" id="v-cal"></section>
  <section class="view" id="v-map">
    <div class="mapbar">
      <select class="pill" id="mYear" aria-label="Year"></select>
      <div class="seg" id="mMode">
        <button data-v="all" class="on">All</button><button data-v="train">Train</button><button data-v="flight">Flight</button>
      </div>
    </div>
    <p class="stats" id="mStats"></p>
    <div id="mapbox"></div>
  </section>
</main>

<button class="fab" id="fab" aria-label="Add trip" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs" id="tabs">
  <button data-tab="trips"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>Trips</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>
</nav>

<div class="scrim" id="scrim"></div>

<!-- trip form -->
<div class="sheet" id="sheetTrip" role="dialog" aria-modal="true" aria-labelledby="fTitle">
  <div class="grab"></div>
  <h2 id="fTitle">Add trip</h2>
  <div class="seg full" id="fMode"><button data-v="train">Train</button><button data-v="flight">Flight</button></div>
  <div class="seg full" id="fWho"><button data-v="both">Both of us</button><button data-v="me">Only me</button><button data-v="her">Only her</button></div>
  <label class="f"><span>From</span><div class="acwrap"><input id="fFrom" autocomplete="off" placeholder="Station, airport or city"><ul class="ac" id="acFrom"></ul></div></label>
  <label class="f"><span>To</span><div class="acwrap"><input id="fTo" autocomplete="off" placeholder="Station, airport or city"><ul class="ac" id="acTo"></ul></div></label>
  <div class="two">
    <label class="f"><span>Departure date</span><input type="date" id="fDep"></label>
    <label class="f"><span>Time</span><input type="time" id="fDepT"></label>
  </div>
  <div class="two">
    <label class="f"><span>Arrival date</span><input type="date" id="fArr"></label>
    <label class="f"><span>Time</span><input type="time" id="fArrT"></label>
  </div>
  <div class="two">
    <label class="f"><span id="lNum">Train number</span><input id="fNum" autocomplete="off"></label>
    <label class="f"><span id="lName">Train name</span><input id="fName" autocomplete="off"></label>
  </div>
  <div class="two">
    <label class="f"><span>PNR</span><input id="fPnr" autocomplete="off"></label>
    <label class="f"><span>Class</span><input id="fCls" list="clsList" autocomplete="off"><datalist id="clsList"></datalist></label>
  </div>
  <div class="two">
    <label class="f"><span id="lSeat">Coach and berth</span><input id="fSeat" autocomplete="off"></label>
    <label class="f"><span>Status</span><select id="fSt"><option value="ok">Confirmed</option><option value="rac">RAC</option><option value="wl">Waitlisted</option><option value="cx">Cancelled</option></select></label>
  </div>
  <label class="f"><span>Fare (₹, only you see this)</span><input id="fFare" inputmode="decimal" autocomplete="off"></label>
  <label class="f"><span>Notes</span><textarea id="fNotes"></textarea></label>
  <div class="actions">
    <button class="btn primary" id="fSave">Save trip</button>
    <button class="btn" id="fCancel">Cancel</button>
  </div>
  <div class="actions" id="fEditActions">
    <button class="btn quiet" id="fReturn">Add return trip</button>
    <button class="btn danger" id="fDelete">Delete trip</button>
  </div>
</div>

<!-- settings -->
<div class="sheet" id="sheetSet" role="dialog" aria-modal="true" aria-labelledby="sTitle">
  <div class="grab"></div>
  <h2 id="sTitle">Settings</h2>
  <h3>GitHub sync</h3>
  <p class="hint">Paste a GitHub token with gist permission. It stays on this device and is never uploaded.</p>
  <label class="f"><input id="sTok" type="password" autocomplete="off" placeholder="ghp_… or github_pat_…"></label>
  <div class="actions"><button class="btn primary" id="sConnect">Connect</button><button class="btn" id="sSync">Sync now</button></div>
  <p class="state" id="sState"></p>
  <div id="sShare">
    <h3>Her link</h3>
    <p class="hint">View only. Shows trips marked Both of us or Only her, without fares.</p>
    <label class="f"><input id="sLink" readonly></label>
    <div class="actions"><button class="btn" id="sCopy">Copy link</button><button class="btn" id="sShareBtn">Share</button><button class="btn quiet" id="sOpen">Open her view</button></div>
  </div>
  <h3>Backup</h3>
  <div class="actions"><button class="btn" id="sExport">Download backup</button><label class="btn" style="display:inline-grid;place-items:center">Restore backup<input type="file" id="sImport" accept="application/json,.json" hidden></label></div>
  <div class="actions" style="margin-top:18px"><button class="btn danger" id="sDisconnect">Disconnect this device</button><button class="btn quiet" id="sClose" style="margin-left:auto">Done</button></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
document.addEventListener('DOMContentLoaded', () => {
'use strict';

/* ---------- config ---------- */
const HER = 'Gopa';
const DESC_DATA = 'our-trips-data', DESC_VIEW = 'our-trips-view';
const API = 'https://api.github.com';

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem('ourtrips.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('ourtrips.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('ourtrips.' + k); } catch (e) {} }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function setDot(s) { $('#dot').className = 'dot' + (s ? ' ' + s : ''); }

/* ---------- mode ---------- */
const qs = new URLSearchParams(location.search);
const VIEW_ID = qs.get('view');
const OWNER = !VIEW_ID;

/* ---------- places ---------- */
const RAW = [
 // stations
 ['s','PGT','Palakkad Jn',10.797,76.636],['s','PGTN','Palakkad Town',10.776,76.656],['s','SRR','Shoranur Jn',10.762,76.271],
 ['s','TCR','Thrissur',10.515,76.212],['s','AWY','Aluva',10.109,76.353],['s','ERS','Ernakulam Jn',9.969,76.290],['s','ERN','Ernakulam Town',9.990,76.288],

  const days = Math.round((sod(d) - sod(now)) / 864e5);
  if (days === 0) return t.depT ? 'Today at ' + t.depT : 'Today';
  if (days === 1) return 'Tomorrow' + (t.depT ? ' at ' + t.depT : '');
  if (days < 14) return 'In ' + days + ' days';

  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  return Math.floor(s / 86400) + ' days ago';
}

let map = null, layer = null, mapDirty = true, mYear = 'all', mMode = 'all';

function hav(a, b) {

  return 2 * R * Math.asin(Math.sqrt(h));
}
function arc(a, b) {

  return pts;
}

  for (const k in cities) {
    const {p, list} = cities[k], ll = [p.la, p.lo]; pts.push(ll);
    const dates = list.sort(byDep).reverse().slice(0, 5).map(t => fmtDay(depDate(t)) + ', ' + esc(pcode(t.from)) + ' to ' + esc(pcode(t.to))).join('<br>');
    L.circleMarker(ll, {radius: 4 + Math.sqrt(list.length) * 2.2, color: '#fff', weight: 2, fillColor: '#E3A21A', fillOpacity: 1})
      .bindPopup('<b>' + esc(p.n) + '</b><br>' + list.length + (list.length === 1 ? ' trip' : ' trips') + '<br><span style="color:#6E7C89">' + dates + '</span>')
      .addTo(layer);
  }
  const nc = Object.keys(cities).length;
  $('#mStats').textContent = ts.length ? ts.length + (ts.length === 1 ? ' trip, ' : ' trips, ') + nc + ' places, about ' + Math.round(km).toLocaleString('en-IN') + ' km in a straight line' : 'No trips to show for this filter.';
  setTimeout(() => {
    map.invalidateSize();
    if (pts.length) map.fitBounds(L.latLngBounds(pts), {padding: [36, 36], maxZoom: 7}); else map.fitBounds(INDIA);
  }, 60);
}
$('#mYear').addEventListener('change', e => { mYear = e.target.value; renderMap(); });
$('#mMode').addEventListener('click', e => {

/* ---------- sheets ---------- */
let openSheetEl = null;
function openSheet(id) { openSheetEl = $(id); openSheetEl.classList.add('on'); $('#scrim').classList.add('on'); openSheetEl.scrollTop = 0; }
function closeSheet() { if (openSheetEl) openSheetEl.classList.remove('on'); $('#scrim').classList.remove('on'); openSheetEl = null; }

/* ---------- place autocomplete ---------- */
function allPlaces() {
  const m = new Map();
  for (const p of BUILTIN) m.set(pkey(p), p);
  for (const p of db.places) m.set(pkey(p), p);
  for (const t of live()) { m.set(pkey(t.from), t.from); m.set(pkey(t.to), t.to); }
  return [...m.values()];
}
function usage() { const c = {}; for (const t of live()) { c[pkey(t.from)] = (c[pkey(t.from)] || 0) + 1; c[pkey(t.to)] = (c[pkey(t.to)] || 0) + 1; } return c; }
function searchPlaces(q, mode) {
  q = q.trim().toLowerCase(); const cnt = usage(), res = [];
  for (const p of allPlaces()) {
    const c = (p.c || '').toLowerCase(), n = p.n.toLowerCase(); let s = -1;
    if (!q) s = cnt[pkey(p)] ? 50 : -1;
    else if (c === q) s = 100; else if (c && c.startsWith(q)) s = 80; else if (n.startsWith(q)) s = 70;
    else if (n.split(/[\s(.,-]+/).some(w => w.startsWith(q))) s = 60; else if (n.includes(q)) s = 40;
    if (s < 0) continue;
    if ((mode === 'train' && p.t === 'a') || (mode === 'flight' && p.t === 's')) s -= 30;
    s += Math.min(20, (cnt[pkey(p)] || 0) * 3);
    res.push([s, p]);
  }
  return res.sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]);
}
const kind = p => p.t === 'a' ? 'Airport' : p.t === 's' ? 'Station' : 'Place';
function bindAC(inp, ul) {
  let items = [], hi = -1;
  function draw(list, extra) {
    items = list; hi = -1;
    ul.innerHTML = list.map((p, i) => '<li data-i="' + i + '"><b>' + esc(p.c || '') + '</b><span>' + esc(p.n) + '</span><small>' + kind(p) + '</small></li>').join('') + (extra || '');
    ul.classList.toggle('on', !!ul.innerHTML);
  }
  function suggest() {
    inp._place = null;
    const q = inp.value.trim();
    draw(searchPlaces(q, fMode), q.length >= 3 ? '<li class="find" data-find="1"><span>Find “' + esc(q) + '” on the map</span></li>' : '');
  }
  async function find() {
    const q = inp.value.trim();
    ul.innerHTML = '<li><span>Searching…</span></li>';
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=en&q=' + encodeURIComponent(q));
      const js = await r.json();
      const list = js.map(x => ({t: 'p', c: '', n: x.display_name.split(',').slice(0, 2).map(s => s.trim()).join(', '), la: +(+x.lat).toFixed(4), lo: +(+x.lon).toFixed(4)}));
      if (!list.length) { ul.innerHTML = '<li><span>No place found. Try another spelling.</span></li>'; return; }
      draw(list);
    } catch (e) { ul.innerHTML = '<li><span>Search failed. Check your connection.</span></li>'; }
  }
  function pick(p) { inp._place = p; inp.value = plabel(p); ul.classList.remove('on'); }
  inp.addEventListener('input', suggest);
  inp.addEventListener('focus', suggest);
  inp.addEventListener('blur', () => setTimeout(() => ul.classList.remove('on'), 250));
  ul.addEventListener('pointerdown', e => e.preventDefault());
  ul.addEventListener('mousedown', e => e.preventDefault());
  ul.addEventListener('click', e => {
    const li = e.target.closest('li'); if (!li) return;
    if (li.dataset.find) find(); else if (li.dataset.i != null) pick(items[+li.dataset.i]);
  });
  inp.addEventListener('keydown', e => {
    if (!ul.classList.contains('on')) return;
    const lis = [...ul.querySelectorAll('li[data-i]')];
    if (e.key === 'ArrowDown') hi = Math.min(lis.length - 1, hi + 1);
    else if (e.key === 'ArrowUp') hi = Math.max(0, hi - 1);
    else if (e.key === 'Enter') { if (hi >= 0) { e.preventDefault(); pick(items[hi]); } return; }
    else return;
    e.preventDefault(); lis.forEach((l, i) => l.classList.toggle('hl', i === hi));
  });
  inp.setPlace = p => { inp._place = p || null; inp.value = p ? plabel(p) : ''; };
  inp.resolve = () => {
    if (inp._place) return inp._place;
    const v = inp.value.trim().toLowerCase(); if (!v) return null;
    return allPlaces().find(p => plabel(p).toLowerCase() === v || (p.c && p.c.toLowerCase() === v) || p.n.toLowerCase() === v) || null;
  };
}

/* ---------- trip form ---------- */
let editing = null, fMode = 'train', fWho = 'both';
const fFrom = $('#fFrom'), fTo = $('#fTo');
bindAC(fFrom, $('#acFrom')); bindAC(fTo, $('#acTo'));
$('#fWho button[data-v="her"]').textContent = 'Only ' + HER;
function setSeg(sel, v) { $$(sel + ' button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
function setMode(m) {
  fMode = m; setSeg('#fMode', m);
  $('#lNum').textContent = m === 'flight' ? 'Flight number' : 'Train number';
  $('#lName').textContent = m === 'flight' ? 'Airline' : 'Train name';
  $('#lSeat').textContent = m === 'flight' ? 'Seat' : 'Coach and berth';
  $('#clsList').innerHTML = (m === 'flight' ? ['Economy', 'Premium economy', 'Business'] : ['1A', '2A', '3A', '3E', 'SL', 'CC', 'EC', '2S']).map(c => '<option value="' + c + '">').join('');
}
$('#fMode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.v); });
$('#fWho').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { fWho = b.dataset.v; setSeg('#fWho', fWho); } });
const F = ['dep', 'depT', 'arr', 'arrT', 'num', 'name', 'pnr', 'cls', 'seat', 'st', 'fare', 'notes'];
const fid = k => '#f' + k[0].toUpperCase() + k.slice(1);
function openForm(t, preset) {
  if (!OWNER) return;
  editing = t ? t.id : null;
  const x = t || preset || {};
  setMode(x.mode || 'train');
  fWho = x.who || 'both'; setSeg('#fWho', fWho);
  fFrom.setPlace(x.from); fTo.setPlace(x.to);
  for (const k of F) $(fid(k)).value = x[k] || (k === 'st' ? 'ok' : '');
  $('#fTitle').textContent = t ? 'Edit trip' : 'Add trip';
  $('#fEditActions').hidden = !t;
  openSheet('#sheetTrip');
}
$('#fab').addEventListener('click', () => openForm(null, tab === 'cal' ? {dep: calSel} : null));
$('#fCancel').addEventListener('click', closeSheet);
$('#fSave').addEventListener('click', () => {
  const from = fFrom.resolve(), to = fTo.resolve();
  if (!from) { toast('Choose where the trip starts from the list.'); fFrom.focus(); return; }
  if (!to) { toast('Choose where the trip ends from the list.'); fTo.focus(); return; }
  const v = {}; for (const k of F) v[k] = $(fid(k)).value.trim();
  if (!v.dep) { toast('Add the departure date.'); $('#fDep').focus(); return; }
  if (!v.arr && v.arrT) v.arr = v.depT && v.arrT < v.depT ? nextDay(v.dep) : v.dep;
  if (v.arr && v.arr < v.dep) { toast('Arrival is before departure.'); return; }
  const trip = Object.assign({id: editing || uid(), mode: fMode, who: fWho, from, to}, v, {updatedAt: Date.now()});
  for (const k of F) if (trip[k] === '') delete trip[k];
  if (trip.st === 'ok') delete trip.st;
  for (const p of [from, to]) if (p.t === 'p' && !db.places.some(q => pkey(q) === pkey(p))) db.places.push(p);
  const i = db.trips.findIndex(t => t.id === trip.id);
  if (i >= 0) db.trips[i] = trip; else db.trips.push(trip);
  persist(); closeSheet(); renderAll(); toast(editing ? 'Trip updated' : 'Trip saved');
});
$('#fDelete').addEventListener('click', () => {
  if (!editing || !confirm('Delete this trip?')) return;
  const i = db.trips.findIndex(t => t.id === editing);
  if (i >= 0) db.trips[i] = {id: editing, deleted: true, updatedAt: Date.now()};
  persist(); closeSheet(); renderAll(); toast('Trip deleted');
});
$('#fReturn').addEventListener('click', () => {
  const t = byId(editing); if (!t) return;
  closeSheet();
  setTimeout(() => openForm(null, {mode: t.mode, who: t.who, from: t.to, to: t.from, cls: t.cls}), 200);
});

/* ---------- sync (owner) ---------- */
function persist() { ls.set('db', db); scheduleSync(); }
async function gh(path, opt = {}) {
  const h = {Accept: 'application/vnd.github+json'};
  const tok = OWNER ? ls.get('token', '') : '';
  if (tok) h.Authorization = 'Bearer ' + tok;
  if (opt.body) h['Content-Type'] = 'application/json';
  const r = await fetch(API + path, {method: opt.method || 'GET', headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: 'no-store'});
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function gistFile(g, name) {
  const f = g.files && g.files[name]; if (!f) return null;
  if (f.truncated) return (await fetch(f.raw_url, {cache: 'no-store'})).text();
  return f.content;
}
function merge(a, b) {
  const m = new Map();
  for (const t of [...(a.trips || []), ...(b.trips || [])]) { const o = m.get(t.id); if (!o || (t.updatedAt || 0) > (o.updatedAt || 0)) m.set(t.id, t); }
  const pm = new Map(); for (const p of [...(a.places || []), ...(b.places || [])]) pm.set(pkey(p), p);
  return {trips: [...m.values()].sort((x, y) => x.id < y.id ? -1 : 1), places: [...pm.values()].sort((x, y) => pkey(x) < pkey(y) ? -1 : 1)};
}
function buildView() {
  const updated = db.trips.reduce((m, t) => Math.max(m, t.updatedAt || 0), 0);
  const trips = live().filter(t => t.who !== 'me').map(t => { const c = Object.assign({}, t); delete c.fare; return c; }).sort((x, y) => x.id < y.id ? -1 : 1);
  return {updated, trips};
}
let syncing = false, again = false, syncT = null;
function scheduleSync() { if (!ls.get('token', '')) return; setDot('busy'); clearTimeout(syncT); syncT = setTimeout(sync, 1500); }
async function sync() {
  if (!OWNER || !ls.get('token', '') || !ls.get('dataGist', '')) return;
  if (syncing) { again = true; return; }
  syncing = true; setDot('busy');
  try {
    const dataId = ls.get('dataGist', ''), viewId = ls.get('viewGist', '');
    const g = await gh('/gists/' + dataId);
    let remote = {trips: [], places: []};
    try { const txt = await gistFile(g, 'trips.json'); if (txt) remote = JSON.parse(txt); } catch (e) {}
    const merged = merge(db, remote), mTxt = JSON.stringify(merged);
    const localChanged = mTxt !== JSON.stringify(merge({}, db));
    db = merged; ls.set('db', db);
    if (localChanged) renderAll();
    if (mTxt !== JSON.stringify(merge({}, remote))) await gh('/gists/' + dataId, {method: 'PATCH', body: {files: {'trips.json': {content: mTxt}}}});
    if (viewId) {
      const vTxt = JSON.stringify(buildView());
      if (vTxt !== ls.get('viewPushed', '')) { await gh('/gists/' + viewId, {method: 'PATCH', body: {files: {'view.json': {content: vTxt}}}}); ls.set('viewPushed', vTxt); }
    }
    ls.set('lastSync', Date.now()); setDot('ok');
  } catch (e) {
    setDot('err');
    if (e.status === 401) toast('GitHub rejected the token. Paste a new one in Settings.');
  } finally {
    syncing = false;
    const f = $('#foot'); if (f) f.textContent = footText();
    if (again) { again = false; sync(); }
  }
}
async function connect(tok) {
  ls.set('token', tok);
  $('#sState').textContent = 'Connecting…';
  try {
    let dataId = ls.get('dataGist', ''), viewId = ls.get('viewGist', '');
    if (!dataId || !viewId) {
      const list = await gh('/gists?per_page=100');
      for (const g of list) { if (g.description === DESC_DATA && !dataId) dataId = g.id; if (g.description === DESC_VIEW && !viewId) viewId = g.id; }
    }
    if (!dataId) dataId = (await gh('/gists', {method: 'POST', body: {description: DESC_DATA, public: false, files: {'trips.json': {content: JSON.stringify(merge({}, db))}}}})).id;
    if (!viewId) { const v = JSON.stringify(buildView()); viewId = (await gh('/gists', {method: 'POST', body: {description: DESC_VIEW, public: false, files: {'view.json': {content: v}}}})).id; ls.set('viewPushed', v); }
    ls.set('dataGist', dataId); ls.set('viewGist', viewId);
    await sync();
    toast('Connected to GitHub');
  } catch (e) {
    ls.del('token');
    toast(e.status === 401 ? 'GitHub rejected the token. Check it has gist permission.' : 'Could not reach GitHub. Try again.');
  }
  fillSettings(); renderTrips();
}

/* ---------- settings ---------- */
const herLink = () => { const v = ls.get('viewGist', ''); return v ? location.origin + location.pathname + '?view=' + v : ''; };
function fillSettings() {
  const tok = ls.get('token', '');
  $('#sTok').value = ''; $('#sTok').placeholder = tok ? 'Token saved on this device' : 'ghp_… or github_pat_…';
  $('#sState').textContent = tok ? 'Connected. ' + footText() + '.' : 'Not connected.';
  $('#sShare').hidden = !herLink();
  $('#sLink').value = herLink();
  $('#sSync').hidden = !tok; $('#sDisconnect').hidden = !tok;
}
$('#btnSettings').addEventListener('click', () => { fillSettings(); openSheet('#sheetSet'); });
$('#sClose').addEventListener('click', closeSheet);
$('#sConnect').addEventListener('click', () => { const t = $('#sTok').value.trim(); if (!t) { toast('Paste a token first.'); return; } connect(t); });
$('#sSync').addEventListener('click', async () => { await sync(); fillSettings(); });
$('#sCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(herLink()); toast('Link copied'); } catch (e) { $('#sLink').select(); toast('Select the link and copy it'); } });
$('#sShareBtn').addEventListener('click', async () => {
  if (navigator.share) { try { await navigator.share({title: 'Our trips', url: herLink()}); } catch (e) {} }
  else { try { await navigator.clipboard.writeText(herLink()); toast('Link copied'); } catch (e) {} }
});
$('#sOpen').addEventListener('click', () => window.open(herLink(), '_blank'));
$('#sExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(merge({}, db), null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'our-trips-' + ymd(new Date()) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
$('#sImport').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.trips)) throw 0; db = merge(db, d); persist(); renderAll(); toast('Backup restored'); }
  catch (err) { toast('That file is not a trips backup.'); }
  e.target.value = '';
});
$('#sDisconnect').addEventListener('click', () => {
  if (!confirm('Remove the GitHub token from this device? Your trips stay in GitHub.')) return;
  for (const k of ['token', 'dataGist', 'viewGist', 'viewPushed', 'lastSync']) ls.del(k);
  setDot(''); fillSettings(); renderTrips(); toast('Disconnected');
});

/* ---------- viewer load ---------- */
async function loadView() {
  setDot('busy');
  try {
    const g = await gh('/gists/' + VIEW_ID);
    const v = JSON.parse(await gistFile(g, 'view.json'));
    db.trips = v.trips || []; viewUpdated = v.updated || null;
    ls.set('view.' + VIEW_ID, {trips: db.trips, updated: viewUpdated});
    setDot('ok'); renderAll();
  } catch (e) {
    setDot('err');
    if (!db.trips.length) $('#v-trips').innerHTML = '<p class="empty">Trips could not load. Check your connection and reopen the app.</p>';
  }
}

/* ---------- home-screen app ---------- */
function setupApp() {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#16283A'; g.fillRect(0, 0, 512, 512);
    g.strokeStyle = '#E3A21A'; g.lineWidth = 26; g.lineCap = 'round'; g.setLineDash([46, 30]);
    g.beginPath(); g.moveTo(132, 384); g.quadraticCurveTo(170, 150, 380, 128); g.stroke();
    g.setLineDash([]); g.fillStyle = '#FFFFFF';
    g.beginPath(); g.arc(132, 384, 40, 0, 7); g.fill();
    g.beginPath(); g.arc(380, 128, 40, 0, 7); g.fill();
    const png = c.toDataURL('image/png');
    const man = {name: 'Our trips', short_name: 'Trips', start_url: location.href.split('#')[0], scope: location.origin + location.pathname,
      display: 'standalone', background_color: '#F3F5F4', theme_color: '#16283A', icons: [{src: png, sizes: '512x512', type: 'image/png', purpose: 'any'}]};
    const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add('manifest', 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(man)));
    add('apple-touch-icon', png); add('icon', png);
  } catch (e) {}
}

/* ---------- boot ---------- */
setupApp();
if (!OWNER) { $('#btnSettings').hidden = true; }
show(['trips', 'cal', 'map'].includes(tab) ? tab : 'trips');
renderAll();
if (OWNER) {
  if (ls.get('token', '')) { setDot('ok'); sync(); }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 60000);
} else {
  loadView();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadView(); });
}
});
